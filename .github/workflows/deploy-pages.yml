name: Build and Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build --base=/parent-child-cards/
      - name: Deploy dist to gh-pages
        run: |
          git config --global user.name "wilson"
          git config --global user.email "zhangtao522009@163.com"
          git fetch origin gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf --cached . > /dev/null 2>&1 || true
          rm -rf *
          cp -R dist/* .
          git add -A
          git commit -m "deploy: ${{ github.sha }}" || echo "nothing to commit"
          git push origin gh-pages --force

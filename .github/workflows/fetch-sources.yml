name: Fetch Public Domain Sources

# 定时抓取 Project Gutenberg 公版原著原文（适合儿童的书目，目前为西游记），
# 在 GitHub 服务器执行，规避国内网络波动导致的大文件下载截断。
# 抓取的原文存入 src/data/raw/，作为故事白话改写的底稿素材。
# 有变化时自动提交到 main，触发 deploy-pages 重新构建部署。

on:
  schedule:
    - cron: '30 3 * * 6' # 每周六 03:30 UTC = 北京时间周六 11:30
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch public domain story sources (Gutenberg)
        run: python3 scripts/fetch-public-domain.py

      - name: Commit and push if changed
        if: always() # 即使抓取失败也提交日志，便于排查
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/raw
          if git diff --cached --quiet; then
            echo "公版原文无变化，跳过提交"
          else
            git commit -m "chore: 抓取公版原著原文（Gutenberg）"
            git push origin main
          fi
